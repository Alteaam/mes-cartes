<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes cartes">
<title>Mes cartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:#04060c}body{margin:0}
/* Mise en page : une colonne pensée pour le téléphone. Noir bleuté, texte clair, filets fins ; le bleu cobalt ne sert (thème A « Cobalt nuit ») — ancien thème noir/orange : style.noir-orange.css ; il ne sert que pour la lecture par l'IA et le socle de la vitrine, le doré pour la numérotation. */
:root{
  --bg:#04060c; --bg2:#0a0f1c; --bg3:#121a2e; --line:#172037;
  --text:#eef3ff; --mute:#8693b0; --accent:#2f6bff; --on-accent:#fff;
  --ember:#3d7bff; --ember2:#6aa3ff; --gold:#cdb27a; --err:#ff6b5e; --ok:#7bc47f;
  --danger-bg:transparent; --danger-fg:#ff8d82; --err-bg:#1a0c0a; --err-fg:#ffd2cc; --ok-bg:#0b1a10; --ok-fg:#cdeed0;
  --f-display:'Sora',system-ui,sans-serif; --f-body:'Sora',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;overflow-x:hidden}
body{margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:16px 0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
header.top h1{font-size:21px;font-weight:700;letter-spacing:-.02em;flex:1;color:var(--text);cursor:pointer}
main{padding:20px 0 48px;max-width:760px;margin:0 auto}
.btn{appearance:none;border:1px solid #2e2e2e;border-radius:12px;padding:14px 18px;font:500 15px var(--f-body);letter-spacing:0;color:var(--text);background:transparent;min-height:50px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:#555}
.btn:active{transform:scale(.98)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:#e6e6e6}
.btn.danger{background:var(--danger-bg);border-color:#3a1c18;color:var(--danger-fg)}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
input,select,textarea{width:100%;font:16px var(--f-body);color:var(--text);background:var(--bg2);border:1px solid #2a2a2a;border-radius:10px;padding:12px;min-height:48px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--text)}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-size:11px;font-weight:500;color:var(--mute);margin:0 0 6px;text-transform:uppercase;letter-spacing:.1em}
.field{margin-bottom:14px}
.field.ai input,.field.ai select,.field.ai textarea,.field.ai.chk,label.chk.ai{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.row{display:flex;gap:8px}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.tile:hover{border-color:#4a4a4a}
.tile .im{aspect-ratio:63/88;background:#0a0f1c;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain}
.tile .t{padding:10px 12px 12px;font-size:12.5px;line-height:1.4;color:#d4d4d4;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--mute);padding:44px 6px;line-height:1.5}
.empty b{display:block;font:700 24px var(--f-display);color:var(--text);margin-bottom:8px;letter-spacing:-.02em}
.card-sec{background:transparent;border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:16px}
.card-sec h3{font:500 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.chk{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid #2a2a2a;border-radius:10px;padding:12px;min-height:48px;cursor:pointer;margin-bottom:8px}
.chk input{width:22px;height:22px;min-height:0;accent-color:#fff}
.stamp{display:inline-block;font:600 15px var(--f-mono);color:var(--gold);border:1.5px solid var(--gold);border-radius:6px;padding:3px 10px;background:rgba(205,178,122,.06)}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:4px 11px;border-radius:99px;border:1px solid #3a3a3a;color:var(--text);margin:0 6px 6px 0;text-transform:uppercase;letter-spacing:.09em}
.kv{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px 10px;font-size:15px}
.kv span:nth-child(odd){color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv span{overflow-wrap:anywhere}
.photo-slot{background:var(--bg2);border:1px dashed #333;border-radius:12px;padding:10px;text-align:center}
.photo-slot .pv{aspect-ratio:63/88;background:#0a0f1c;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:13px}
.photo-slot .pv img{width:100%;height:100%;object-fit:contain}
.photo-slot b{display:block;font:500 11px var(--f-body);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
.note{font-size:13px;color:var(--mute);line-height:1.4;margin:10px 0 0}
#toast{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:200}
#toast[hidden]{display:none}
#toast div{background:var(--err-bg);border:1px solid var(--err);color:var(--err-fg);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
#toast.ok div{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-fg)}
#toast b{display:block;color:var(--err);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
#toast.ok b{color:var(--ok)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,7,5,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg2);border:1px solid #2a2a2a;border-radius:16px;padding:18px;width:100%;max-width:420px}
.modal h3{font:700 20px var(--f-display);letter-spacing:-.02em;color:var(--text);margin-bottom:14px}
.modal p{margin:0 0 14px;line-height:1.45;color:var(--text)}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== Vitrine 3D ===== */
.vitrine{position:relative;height:430px;margin-bottom:14px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 88%,rgba(61,123,255,.30),transparent 52%),radial-gradient(ellipse at 50% 0%,#101a33,transparent 70%),#04060c;border:1px solid var(--line)}
.persp{position:absolute;inset:0;perspective:1000px}
.floatwrap{position:absolute;left:50%;top:44%;width:0;height:0;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.floatwrap{animation:none}}
.rot{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h);border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#0d1424;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.face img{width:100%;height:100%;max-width:none;object-fit:cover;display:block;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.face .gloss{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(115deg,transparent calc(var(--gx,50%) - 22%),rgba(255,255,255,.38) var(--gx,50%),transparent calc(var(--gx,50%) + 22%))}
.face .ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mute);font-size:13px}
.pedestal{position:absolute;left:50%;bottom:42px;width:260px;height:70px;margin-left:-130px;pointer-events:none}
.pedestal::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse,rgba(190,215,255,.95) 0%,rgba(61,123,255,.6) 30%,rgba(61,123,255,.14) 60%,transparent 72%);filter:blur(3px)}
.pedestal::after{content:"";position:absolute;left:18%;right:18%;top:30%;height:40%;border-radius:50%;background:linear-gradient(#1c2a4a,#0a1226);border:1.5px solid var(--ember);box-shadow:0 0 28px var(--ember),inset 0 0 12px rgba(106,163,255,.6)}
.thumbs{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:10px;z-index:2}
.thumbs button{width:52px;height:68px;padding:0;border:1.5px solid #333;border-radius:8px;overflow:hidden;background:#0a0f1c;cursor:pointer}
.thumbs button.on{border-color:var(--text)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.hint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);pointer-events:none}

/* ===== Éditeur de détourage ===== */
.ed{position:fixed;inset:0;z-index:150;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ed .bar{display:flex;gap:8px;padding:10px;flex-wrap:wrap;background:var(--bg2);border-bottom:1px solid var(--line)}
.ed .bar .btn{flex:1;min-width:0;padding:10px 6px;font-size:14px;min-height:44px}
.ed .bar .btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ed .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.ed canvas.main{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none}
.ed canvas.loupe{position:absolute;top:10px;left:10px;width:120px;height:120px;border:2px solid var(--text);border-radius:50%;display:none;background:#000;pointer-events:none}
.ed .foot{display:flex;gap:8px;padding:10px;background:var(--bg2);border-top:1px solid var(--line)}
.ed .foot .btn{flex:1}
.ed .info{text-align:center;font-size:12px;color:var(--mute);padding:6px}
[hidden]{display:none!important}

.nav{display:flex;gap:6px;margin:0 0 16px}
.nav a{flex:1;text-align:center;padding:10px 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line)}
.nav a.on{color:var(--text);border-bottom-color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{appearance:none;font:500 12px var(--f-body);letter-spacing:.08em;color:var(--mute);background:transparent;border:1px solid #2e2e2e;border-radius:99px;padding:9px 14px;min-height:40px;cursor:pointer}
.chip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.tile .im{position:relative}.fav{position:absolute;top:6px;right:8px;color:var(--ember2);font-size:16px;text-shadow:0 1px 4px #000}
.heart{appearance:none;background:transparent;border:1px solid #2e2e2e;border-radius:50%;width:46px;height:46px;flex:none;color:#555;font-size:22px;cursor:pointer}
.heart.on{color:var(--ember2);border-color:var(--ember2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.stats b{display:block;font:700 28px var(--f-display);letter-spacing:-.02em}
.stats span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.bar{position:relative;display:flex;justify-content:space-between;gap:10px;padding:9px 10px;margin-bottom:6px;border-radius:8px;overflow:hidden;background:var(--bg3);font-size:14px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#2a2a2a;z-index:0}
.bar span,.bar b{position:relative;z-index:1}.bar span{min-width:0;overflow-wrap:anywhere}
.rare{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.rare b{color:var(--gold);flex:none}

.rows{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;position:relative}
.lrow .im{width:64px;flex:none}.lrow .t{padding:8px 12px 8px 0;flex:1;min-width:0}.fav2{color:var(--ember2);padding-right:14px}
.wish{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.wish.got .wt{opacity:.5;text-decoration:line-through}.wt{min-width:0;overflow-wrap:anywhere;flex:1}
.wb{display:flex;flex-direction:column;gap:6px;flex:none}.wb .btn{min-height:40px;padding:8px 12px;font-size:13px}
.zoom{position:fixed;inset:0;z-index:160;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.zbar{display:flex;gap:6px;padding:10px;background:var(--bg2);border-bottom:1px solid var(--line)}.zbar .btn{flex:1;min-width:0;padding:8px 4px;font-size:13px;min-height:44px}.zbar .btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.zbody{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}
.zbody img{max-width:100%;max-height:100%;object-fit:contain;margin:auto}.zbody img.big{max-width:none;max-height:none;width:250%}
.nav a{font-size:11px;letter-spacing:.1em}

h4.grp{grid-column:1/-1;margin:14px 0 2px;font:500 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
.rows h4.grp{margin:10px 0 0}
.warnmk{position:absolute;bottom:6px;right:8px;color:var(--gold);font-size:15px;text-shadow:0 1px 4px #000}
.selbox{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.tile.sel{border-color:#fff}.tile.sel .selbox{background:#fff}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:120;display:flex;gap:6px;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--line)}
.selbar span{flex:1;font-size:13px;color:var(--mute);min-width:0}.selbar .btn{min-height:44px;padding:8px 12px;font-size:13px}
.vfull{position:absolute;top:8px;right:8px;z-index:3;width:40px;height:40px;border-radius:10px;border:1px solid #333;background:rgba(0,0,0,.55);color:var(--text);font-size:18px;cursor:pointer}
.vitrine.full{position:fixed;inset:0;z-index:140;height:auto;margin:0;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}
.vitrine.full .floatwrap{top:46%}.vitrine.full .pedestal{bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(360px,70vw);margin-left:calc(min(360px,70vw)/-2)}
.vitrine.full .thumbs{bottom:calc(14px + env(safe-area-inset-bottom,0px))}.vitrine.full .hint{top:calc(10px + env(safe-area-inset-top,0px))}
.vitrine.full .vfull{top:calc(10px + env(safe-area-inset-top,0px));font-size:15px}
.show{position:fixed;inset:0;z-index:170;background:#000}.show .vitrine.full{z-index:1}
.show .cap{position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;padding:0 24px;font-size:15px;pointer-events:none}.show .cap span{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.show .ctl{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:center;gap:8px}.show .ctl .btn{min-height:46px;min-width:52px}
.brow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.brow .mono{color:var(--mute);overflow-wrap:anywhere;font-size:11.5px}.brow i{grid-column:1/-1;font-style:normal}
.brow.ok i{color:var(--ok)}.brow.warn i{color:var(--gold)}.brow.bad i{color:var(--err)}

.brow{grid-template-columns:auto 1fr}.bth{display:flex;gap:4px}.bth img{width:44px;height:62px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.bin{display:flex;flex-direction:column;gap:2px;min-width:0}.bact{display:flex;gap:6px;margin-top:6px}.bact .btn{min-height:36px;padding:6px 10px;font-size:12px}

.sortrow{margin-bottom:12px;align-items:center;gap:8px;flex-wrap:nowrap}
.sortrow select{flex:1 1 0;min-width:0;width:auto}
.sortrow .cnt{flex:none;color:var(--mute);font-size:13px;white-space:nowrap}
.sortrow .btn{flex:none;padding:0 12px;min-height:48px;white-space:nowrap}

.lrow2{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ln{min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}.ln .mono{color:var(--mute);font-size:12px}
.lb{display:flex;gap:6px;flex:none}.lb .btn{min-height:40px;padding:6px 10px;font-size:12px}

.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tg .stamp.sm{font-size:11px;padding:2px 7px;border-width:1px;border-radius:5px}
.tg .badge.sm{font-size:9.5px;padding:3px 8px;margin:0;letter-spacing:.07em}
.tg .badge.gd{border-color:var(--gold);color:var(--gold)}

.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
.chips::-webkit-scrollbar{display:none}.chip{flex:none;min-height:36px;padding:7px 13px}
.filt{margin-bottom:10px}.filt select,.filt1{min-height:44px}.filt1{margin-bottom:10px}
.sortrow .btn.ico{width:44px;min-height:44px;padding:0;font-size:16px}.sortrow .btn.ico.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sortrow select{min-height:44px}
.cards .tile{content-visibility:auto;contain-intrinsic-size:auto 330px}

/* Appli installée (iPhone) : le contenu démarre sous la barre d'état, on le décale */
header.top{top:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}body{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<header class="top">
  <h1 id="logo">Mes cartes</h1>
  <button class="btn small" id="btnOut" hidden>Quitter</button>
</header>
<nav class="nav"><a href="#">Collection</a><a href="#stats">Stats</a><a href="#lists">Listes</a></nav>
<main id="app"><div class="empty"><b>Chargement…</b>Ta collection arrive.</div></main>
<div id="toast" hidden><div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

// ---------- Images ----------
async function fileToCanvas(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const max = 3000, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}

// ---------- Encodage : très bonne qualité + miniature légère ----------
// Plein format : 1600 px de haut max (≈ 1150 × 1600 pour une carte), WebP q.85 (JPEG q.85 sinon) : très net, 2 à 4× plus léger qu'un JPEG q.92.
// Miniature : 420 px de haut, ~20 Ko, utilisée pour les listes ; la vitrine, le diaporama et le recadrage utilisent toujours le plein format.
let _webpOK;

}

// ---------- Détection automatique de la carte ----------
// ===== Détection automatique de la carte (fonctions pures, sans DOM) =====
// findCardQuad : repère les 4 coins sur une version réduite. refineQuad : affine chaque bord en pleine résolution.
function findCardQuad(px, w, h) {
  const lum = i => .3 * px[i] + .59 * px[i + 1] + .11 * px[i + 2];
  const rowStat = y => { let m = 0, m2 = 0; for (let x = 0; x < w; x++) { const l = lum((y * w + x) * 4); m += l; m2 += l * l; } m /= w; return { m, v: m2 / w - m * m }; };
  const colStat = x => { let m = 0, m2 = 0; for (let y = 0; y < h; y++) { const l = lum((y * w + x) * 4); m += l; m2 += l * l; } m /= h; return { m, v: m2 / h - m * m }; };
  const flat = s => s.v < 60 && s.m < 28;   // bande noire uniforme (capture d'écran)
  let t = 0, b = h - 1, l = 0, r = w - 1;
  while (t < b && flat(rowStat(t))) t++; while (b > t && flat(rowStat(b))) b--;
  while (l < r && flat(colStat(l))) l++; while (r > l && flat(colStat(r))) r--;
  const rw = r - l + 1, rh = b - t + 1;
  const full = () => ({ quad: [[l, t], [r + 1, t], [r + 1, b + 1], [l, b + 1]], conf: 0, fallback: true, region: [l, t, r + 1, b + 1] });
  if (rw < 20 || rh < 20) return full();

  // fond = médiane de l'anneau extérieur de la zone utile
  const m = Math.max(3, Math.round(.04 * Math.min(rw, rh)));
  const ring = [[], [], []];
  for (let y = t; y <= b; y++) for (let x = l; x <= r; x++) {
    if (x - l < m || r - x < m || y - t < m || b - y < m) { const i = (y * w + x) * 4; ring[0].push(px[i]); ring[1].push(px[i + 1]); ring[2].push(px[i + 2]); }
  }
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const bg = ring.map(med);

  // carte des écarts au fond (0..255) + seuil d'Otsu
  const D = new Uint8Array(rw * rh), hist = new Array(256).fill(0);
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
    const i = ((y + t) * w + x + l) * 4;
    const d = Math.min(255, (Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2])) / 3 | 0);
    D[y * rw + x] = d; hist[d]++;
  }
  const N = rw * rh; let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wB = 0, sB = 0, best = -1, thr = 30, mB = 0, mF = 0;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue; const wF = N - wB; if (!wF) break;
    sB += i * hist[i]; const a = sB / wB, c = (sum - sB) / wF, v = wB * wF * (a - c) * (a - c);
    if (v > best) { best = v; thr = i; mB = a; mF = c; }
  }
  if (mF - mB < 22) return full();            // rien ne se détache du fond : la zone utile est la carte
  const rd = [];   // bruit du fond : écart des pixels de l'anneau
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) if (x < m || rw - 1 - x < m || y < m || rh - 1 - y < m) rd.push(D[y * rw + x]);
  rd.sort((p, q) => p - q);
  thr = Math.max(14, Math.min(60, 2.2 * rd[Math.floor(rd.length * .98)]));

  let M = new Uint8Array(N); for (let i = 0; i < N; i++) M[i] = D[i] > thr ? 1 : 0;
  const morph = (src, grow) => {              // dilatation (grow) ou érosion 3×3
    const out = new Uint8Array(N);
    for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
      let hit = grow ? 0 : 1;
      for (let dy = -1; dy <= 1 && (grow ? !hit : hit); dy++) for (let dx = -1; dx <= 1; dx++) {
        const yy = y + dy, xx = x + dx; const v = (yy < 0 || xx < 0 || yy >= rh || xx >= rw) ? (grow ? 0 : 1) : src[yy * rw + xx];
        if (grow ? v : !v) { hit = grow ? 1 : 0; break; }
      }
      out[y * rw + x] = hit;
    }

  };
  M = morph(morph(M, true), false); M = morph(morph(M, true), false);   // fermeture
  // remplissage des trous : tout ce qui n'est pas relié au bord est de la carte
  const out = new Uint8Array(N), st = [];
  const push = (x, y) => { const i = y * rw + x; if (!M[i] && !out[i]) { out[i] = 1; st.push(i); } };
  for (let x = 0; x < rw; x++) { push(x, 0); push(x, rh - 1); } for (let y = 0; y < rh; y++) { push(0, y); push(rw - 1, y); }
  while (st.length) { const i = st.pop(), x = i % rw, y = (i / rw) | 0; if (x > 0) push(x - 1, y); if (x < rw - 1) push(x + 1, y); if (y > 0) push(x, y - 1); if (y < rh - 1) push(x, y + 1); }
  for (let i = 0; i < N; i++) M[i] = out[i] ? 0 : 1;

  M = morph(morph(M, false), true);

      if (x < rw - 1 && M[i + 1] && !lab[i + 1]) { lab[i + 1] = L; q.push(i + 1); }
      if (y > 0 && M[i - rw] && !lab[i - rw]) { lab[i - rw] = L; q.push(i - rw); }
      if (y < rh - 1 && M[i + rw] && !lab[i + rw]) { lab[i + rw] = L; q.push(i + rw); } }
    if (a > bestA) { bestA = a; bestL = L; }
  }
  if (!bestL || bestA < N * .08 || bestA > N * .985) return full();

  // contour → enveloppe convexe
  const pts = [];
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
    if (lab[y * rw + x] !== bestL) continue;
    const e = x === 0 || y === 0 || x === rw - 1 || y === rh - 1 || lab[y * rw + x - 1] !== bestL || lab[y * rw + x + 1] !== bestL || lab[(y - 1) * rw + x] !== bestL || lab[(y + 1) * rw + x] !== bestL;
    if (e) pts.push([x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]);
  }
  pts.sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  const cross = (o, a, c) => (a[0] - o[0]) * (c[1] - o[1]) - (a[1] - o[1]) * (c[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  let hull = lo.slice(0, -1).concat(up.slice(0, -1));
  const area = P => { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], c = P[(i + 1) % P.length]; s += a[0] * c[1] - c[0] * a[1]; } return Math.abs(s) / 2; };
  const hullArea = area(hull);
  while (hull.length > 26) {                   // retire les sommets qui comptent le moins
    let mi = 0, ma = Infinity;
    for (let i = 0; i < hull.length; i++) { const a = Math.abs(cross(hull[(i + hull.length - 1) % hull.length], hull[i], hull[(i + 1) % hull.length])); if (a < ma) { ma = a; mi = i; } }
    hull.splice(mi, 1);
  }
  // quadrilatère d'aire maximale parmi les sommets : ce sont les 4 coins de la carte
  let bq = null, ba = -1; const n = hull.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) for (let q = k + 1; q < n; q++) {
    const a = area([hull[i], hull[j], hull[k], hull[q]]); if (a > ba) { ba = a; bq = [hull[i], hull[j], hull[k], hull[q]]; }
  }
  if (!bq) return full();
  const cx = bq.reduce((s, p) => s + p[0], 0) / 4, cy = bq.reduce((s, p) => s + p[1], 0) / 4;
  bq.sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
  let s0 = 0; for (let i = 1; i < 4; i++) if (bq[i][0] + bq[i][1] < bq[s0][0] + bq[s0][1]) s0 = i;

  return { quad, conf: ba / hullArea, fallback: false, region: [l, t, r + 1, b + 1] };
}

// Affine chaque bord : cherche le vrai contour le long de plusieurs coupes, ajuste une droite, recoupe les droites.
function refineQuad(px, W, H, q, bounds, offFrac = .02, spanFrac = .05) {
  const mg = 6, bd = bounds ? [bounds[0] + mg, bounds[1] + mg, bounds[2] - mg, bounds[3] - mg] : [0, 0, W, H];
  const inside = (x, y) => x >= bd[0] && x <= bd[2] && y >= bd[1] && y <= bd[3];

    x = Math.max(0, Math.min(W - 1.001, x)); y = Math.max(0, Math.min(H - 1.001, y));
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = (y0 * W + x0) * 4, j = i + W * 4;
    const v = k => .3 * px[k] + .59 * px[k + 1] + .11 * px[k + 2];
    return v(i) * (1 - fx) * (1 - fy) + v(i + 4) * fx * (1 - fy) + v(j) * (1 - fx) * fy + v(j + 4) * fx * fy;
  };
  const cx = q.reduce((s, p) => s + p[0], 0) / 4, cy = q.reduce((s, p) => s + p[1], 0) / 4;
  const lines = [];
  for (let e = 0; e < 4; e++) {
    const a = q[e], b = q[(e + 1) % 4], dx = b[0] - a[0], dy = b[1] - a[1], Len = Math.hypot(dx, dy);
    const u = [dx / Len, dy / Len]; let nrm = [u[1], -u[0]];

    const found = [];
    const probe = (span, outermost) => {
      const res = [];
      for (let tt = .1; tt <= .9001; tt += .04) {
        const c = [a[0] + u[0] * Len * tt, a[1] + u[1] * Len * tt];

        for (let s = -span; s <= span; s++) {
          let v = 0; for (let k = -2; k <= 2; k++) v += g(c[0] + nrm[0] * s + u[0] * k, c[1] + nrm[1] * s + u[1] * k); prof.push(v / 5);

        for (let i = 2; i < prof.length - 2; i++) {
          const sx = c[0] + nrm[0] * (i - span), sy = c[1] + nrm[1] * (i - span);

        if (outermost) { for (let i = prof.length - 3; i >= 2; i--) if (dd[i] >= .45 * mx && dd[i] >= dd[i - 1] && dd[i] >= dd[i + 1]) { pick = i; break; } }
        else { for (let i = 2; i < prof.length - 2; i++) if (dd[i] === mx) { pick = i; break; } }
        if (pick >= 0) { const s = pick - span; res.push([c[0] + nrm[0] * s, c[1] + nrm[1] * s]); }
      }
      return res;
    };
    let pts1 = probe(Math.max(8, Math.min(110, Math.round(spanFrac * Len))), true);
    found.push(...pts1);
    const fit = pts => {                       // droite par moindres carrés orthogonaux
      const n = pts.length, mx = pts.reduce((s, p) => s + p[0], 0) / n, my = pts.reduce((s, p) => s + p[1], 0) / n;
      let sxx = 0, syy = 0, sxy = 0; for (const p of pts) { sxx += (p[0] - mx) ** 2; syy += (p[1] - my) ** 2; sxy += (p[0] - mx) * (p[1] - my); }
      const th = .5 * Math.atan2(2 * sxy, sxx - syy); return { p: [mx, my], d: [Math.cos(th), Math.sin(th)] };

      <div class="info" id="info"></div><div class="stage" id="stage"><canvas class="main" id="cv"></canvas><canvas class="loupe" id="lp" width="240" height="240"></canvas></div>
      <div class="foot"><button class="btn" id="no">Annuler</button><button class="btn primary" id="ok">Valider</button></div>`;

    const full = () => { rect = { l: 0, t: 0, r: src.width, b: src.height }; pts = [[0, 0], [src.width, 0], [src.width, src.height], [0, src.height]]; mode = 'rect'; note = 'Photo déjà recadrée : ajuste les bords si besoin, ou touche Auto.'; syncMode(); };

    };

      $('#info', ov).textContent = note + (mode === 'rect' ? ' Glisse les bords ou les coins : le résultat reste droit.' : ' Glisse les 4 coins pour corriger la perspective.');
    }

      lp.style.display = 'block'; const left = (ix * scale + PAD) < stage.clientWidth / 2; lp.style.left = left ? 'auto' : '10px'; lp.style.right = left ? '10px' : 'auto';
      const sw = 64, k = 240 / sw, sx = ix - sw / 2, sy = iy - sw / 2;
      lg.fillStyle = '#000'; lg.fillRect(0, 0, 240, 240);

let toastTimer;

// Les branchements transforment toute erreur en { code, message } avec un code parmi ceux de la table ci-dessous.
function fail(source, e, hint = '') {
  const code = (e && e.code) || 'other', raw = (e && (e.message || e.error_description)) || String(e || '');
  const map = {
    network: ['Réseau', 'Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.'],
    permission: ['Permissions', 'Accès refusé : session expirée, ou droits insuffisants (seul le propriétaire peut modifier la collection). ' + raw],
    quota: ['Base de données', 'L\'espace de stockage est plein. Supprime des cartes ou des photos inutiles. ' + raw],
    too_large: ['Envoi d\'image', 'La photo est trop lourde.'],
    bad_type: ['Envoi d\'image', 'Ce format d\'image n\'est pas accepté.'],
    ai_denied: ['IA', 'La lecture par l\'IA n\'a pas été autorisée. Relance-la et accepte la demande.'],
    ai_busy: ['IA', 'Trop de demandes ou limite atteinte. Réessaie dans un moment.'],
    ai_unreadable: ['IA', 'La réponse de l\'IA est illisible. Réessaie.'],
    ai_images: ['IA', 'L\'IA n\'a pas pu lire les images (type, taille ou envoi). Remplace-les puis réessaie. ' + raw],
    ai_unavailable: ['IA', 'L\'IA est indisponible pour le moment. ' + raw],
    ai_expired: ['Permissions', 'Ta session a expiré : recharge la page et reconnecte-toi.']
  };
  let [cat, msg] = map[code] || [source, raw || 'Erreur inconnue.'];
  if (code === 'quota' && source === 'Envoi d\'image') cat = source;
  toast('Erreur — ' + cat, (hint ? hint + ' ' : '') + msg);
  console.error(source, e);
}

// ---------- Utilitaires cartes ----------
const byId = (t, id) => lists[t].find(x => x.id === id);
function runStr(c) {
  if (!c.print_run) return '';
  const pad = n => String(n).padStart(+c.num_pad || 0, '0');   // « 008/008 » quand la carte est imprimée avec des zéros
  if (c.print_run === 1) return pad(1) + '/' + pad(1);
  return (c.serial_number ? pad(c.serial_number) : '') + '/' + pad(c.print_run);
}
function buildName(c) {
  const col = byId('collections', c.collection_id);
  const parts = [
    byId('players', c.player_id)?.name,
    byId('brands', c.brand_id)?.name,
    col ? (col.name + (col.year ? ' ' + col.year : '')) : '',
    byId('parallels', c.parallel_id)?.name,
    runStr(c)
  ].filter(Boolean);
  return parts.join(' — ') || 'Carte sans nom';
}

function makeDoc(d, files, prev) {
  const doc = {
    name: buildName(d),
    player_id: d.player_id || null, team_id: d.team_id || null, sport_id: d.sport_id || null,
    brand_id: d.brand_id || null, collection_id: d.collection_id || null, parallel_id: d.parallel_id || null,
    card_number: String(d.card_number || '').replace(/^#/, ''),

    is_rookie: !!d.is_rookie, is_auto: !!d.is_auto, is_memorabilia: !!d.is_memorabilia,
    notes: d.notes || '', is_graded: !!d.is_graded, grader: d.is_graded ? (d.grader || '') : '', grade_value: d.is_graded ? (d.grade_value || '') : '', cert_number: d.is_graded ? (d.cert_number || '') : '', binder_id: d.binder_id || null, price_paid: d.price_paid > 0 ? d.price_paid : null, bought_at: d.bought_at || '', favorite: !!d.favorite, front_file: files.front || null, back_file: files.back || null, front_thumb: files.front_thumb || null, back_thumb: files.back_thumb || null,
    needs_check: '',

// ---------- Vérification de la numérotation ----------
const COMMON_RUNS = new Set([1, 2, 3, 5, 8, 10, 12, 15, 20, 25, 30, 35, 40, 49, 50, 60, 65, 70, 75, 80, 88, 99, 100, 125, 149, 150, 175, 199, 200, 249, 250, 299, 300, 349, 399, 400, 499, 500, 799, 999, 1000, 1999, 2000]);
function checkNumbering(d, selfId) {
  const errors = [], warns = [];
  const run = d.print_run, ser = d.serial_number, num = String(d.card_number || '');
  if (ser && !run) errors.push('Un exemplaire est indiqué sans tirage.');
  if (run && ser && ser > run) errors.push(`L'exemplaire (${ser}) dépasse le tirage (/${run}).`);
  if (run === 1 && ser && ser !== 1) errors.push('Une carte 1/1 ne peut avoir que l\'exemplaire 1.');
  if (/^\s*#?\s*\d+\s*\/\s*\d+\s*$/.test(num)) warns.push(`Le numéro de carte « ${num.trim()} » ressemble à une numérotation de tirage : le numéro de checklist est celui de la série (ex. 43, S-RL).`);
  if (run && run > 100 && !COMMON_RUNS.has(run)) warns.push(`Le tirage /${run} est inhabituel : vérifie qu'il est bien lisible sur la carte.`);
  if (run && ser) {
    const same = cards.find(x => x.id !== selfId && x.serial_number === ser && x.print_run === run && x.player_id === d.player_id && (x.collection_id || '') === (d.collection_id || '') && (x.parallel_id || '') === (d.parallel_id || '') && (x.card_number || '') === num.replace(/^#/, ''));
    if (same) warns.push(`L'exemplaire ${ser}/${run} de cette carte est déjà enregistré (« ${same.name} »).`);
  }
  return { errors, warns };
}
// Cartes à contrôler : joueur manquant ou numérotation douteuse (liste, lot)
function issuesOf(c) {
  const r = checkNumbering(c, c.id), out = [...r.errors, ...r.warns.filter(w => !/déjà enregistré/.test(w))];
  if (!c.player_id) out.unshift('Joueur à compléter.');
  if (c.needs_check) out.unshift(c.needs_check);
  return out;
}

// ---------- Création de listes (joueurs, marques…) et lecture IA appliquée à un brouillon ----------
// Collections : nom + année affichés « nom année ». On nettoie « Select (2025-26) » et on évite le doublon d'année.
const cleanColl = (name, year) => {
  name = String(name).replace(/\s*\((\d{4}(?:[-/]\d{2,4})?)\)\s*/g, ' $1 ').replace(/\s+/g, ' ').trim(); year = String(year || '').trim();
  if (year && name.toLowerCase().includes(year.toLowerCase())) year = '';
  return { name, year };
};
const collKey = x => (x.name + ' ' + (x.year || '')).replace(/\s+/g, ' ').trim().toLowerCase();
async function upsertGlobal(t, name, year = '') {
  name = name.trim(); year = (year || '').trim();
  if (t === 'collections') ({ name, year } = cleanColl(name, year));
  const ex = lists[t].find(x => t === 'collections' ? collKey(x) === collKey({ name, year }) : x.name.toLowerCase() === name.toLowerCase());
  if (ex) return ex;
  const rec = t === 'collections' ? { name, year } : { name };
  const id = Store.newId(); await Store.save(t, id, rec);
  const row = { id, ...rec }; lists[t] = [...lists[t].filter(x => x.id !== id), row].sort((a, b) => collator.compare(String(a.name), String(b.name)));
  return row;
}
async function applyAI(c, d) {
  const set = async (key, t, name, year) => { if (name && String(name).trim()) d[key] = (await upsertGlobal(t, String(name), year)).id; };
  await set('player_id', 'players', c.player); await set('team_id', 'teams', c.team); await set('sport_id', 'sports', c.sport);
  await set('brand_id', 'brands', c.brand); await set('collection_id', 'collections', c.collection, c.year ? String(c.year) : ''); await set('parallel_id', 'parallels', c.parallel);
  if (c.card_number) d.card_number = String(c.card_number).replace(/^#/, '');
  if (Number.isFinite(+c.print_run) && +c.print_run > 0) { d.print_run = +c.print_run; d.serial_number = +c.serial_number > 0 ? +c.serial_number : (+c.print_run === 1 ? 1 : null); d.num_pad = +c.serial_digits >= 2 && +c.serial_digits <= 6 ? +c.serial_digits : 0; }
  if (c.rookie) d.is_rookie = true; if (c.auto) d.is_auto = true; if (c.memorabilia) d.is_memorabilia = true;
  if (c.graded && String(c.grade || '').trim()) { d.is_graded = true; d.grader = String(c.grader || '').trim().toUpperCase() || 'PSA'; d.grade_value = String(c.grade).trim(); if (c.cert_number) d.cert_number = String(c.cert_number).replace(/\D/g, ''); }
  return d;
}

}

// ---------- Suppression avec « Annuler » ----------
const pendingDel = new Map();
function toastAction(title, msg, label, fn, ms = 7000) {
  const t = $('#toast'); t.className = 'ok';
  $('div', t).innerHTML = `<b>${esc(title)}</b>${esc(msg)} <button class="btn small" id="tAct" style="margin-top:8px;min-height:36px">${esc(label)}</button>`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
  $('#tAct').onclick = () => { t.hidden = true; clearTimeout(toastTimer); fn(); };

function scheduleDelete(list) {
  list.forEach(c => pendingDel.set(c.id, c));
  cards = cards.filter(c => !pendingDel.has(c.id));
  const timer = setTimeout(async () => {
    for (const c of list) {
      if (!pendingDel.has(c.id)) continue;
      try { await Store.remove('cards', c.id); for (const a of [c.front_file, c.back_file, c.front_thumb, c.back_thumb]) if (a) await Files.remove(a); }
      catch (e) { fail('Base de données', e, 'Suppression impossible.'); cards = [c, ...cards]; }
      pendingDel.delete(c.id);
    }
    route();
  }, 7000);
  toastAction('Supprimée' + (list.length > 1 ? 's' : ''), list.length > 1 ? list.length + ' cartes supprimées.' : 'La carte a été supprimée.', 'Annuler', () => {
    clearTimeout(timer); list.forEach(c => pendingDel.delete(c.id));
    cards = [...cards, ...list].sort((a, b) => (b.created_at || 0) - (a.created_at || 0)); route();
  });
}

const collName = c => { const x = byId('collections', c.collection_id); return x ? x.name + (x.year ? ' ' + x.year : '') : '— Sans collection'; };

function filtered() {

    && (!view.sport || c.sport_id === view.sport) && (!view.brand || c.brand_id === view.brand) && (!view.binder || c.binder_id === view.binder) && (!view.graded || c.is_graded)

  const pn = c => byId('players', c.player_id)?.name || '';

    recent: (a, b) => (b.created_at || 0) - (a.created_at || 0), old: (a, b) => (a.created_at || 0) - (b.created_at || 0),

function startVitrine(root, opts = {}) {
  const rot = $('#rot', root);
  let rx = -8, ry = 0, vx = 0, vy = 0, drag = false, lx = 0, ly = 0, target = null, raf, alive = true;
  const apply = () => {
    rot.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    const gx = ((((ry % 360) + 360) % 360) / 360 * 200 - 50) + rx * 0.6;
    root.querySelectorAll('.gloss').forEach(g => g.style.setProperty('--gx', ((gx % 200) + 200) % 200 - 50 + '%'));

  };

    if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size >= 2) { const t = two(); z = Math.max(1, Math.min(5, pinch.z0 * t.d / pinch.d)); tx = pinch.tx0 + (t.mx - pinch.mx); ty = pinch.ty0 + (t.my - pinch.my); if (z === 1) tx = ty = 0; applyZ(); return; }

    if (ptrs.size === 1) { const r = [...ptrs.values()][0]; drag = true; lx = r.x; ly = r.y; }

    }

    btn.addEventListener('pointerdown', e => e.stopPropagation());

      const a = +btn.dataset.a; const base = Math.round(ry / 360) * 360;

  });

    if (!alive) return;
    if (!drag) {
      if (target) { ry += (target.y - ry) * .14; rx += (target.x - rx) * .14; if (Math.abs(target.y - ry) < .3 && Math.abs(target.x - rx) < .3) { ry = target.y; rx = target.x; target = null; } }

    }
    apply(); raf = requestAnimationFrame(loop);

let fullOff = null;
function toggleFull(root, on) {
  on = on ?? !root.classList.contains('full');
  const fit = () => {
    const ar = parseFloat(root.dataset.w) / parseFloat(root.dataset.h), vh = innerHeight - 150, vw = innerWidth * .9;
    const H = Math.min(vh, vw / ar); root.style.setProperty('--h', Math.round(H) + 'px'); root.style.setProperty('--w', Math.round(H * ar) + 'px');
  };
  if (on) {
    root.dataset.w = parseFloat(getComputedStyle(root).getPropertyValue('--w')); root.dataset.h = parseFloat(getComputedStyle(root).getPropertyValue('--h'));
    root.dataset.ow = root.style.getPropertyValue('--w'); root.dataset.oh = root.style.getPropertyValue('--h');
    root.classList.add('full'); document.body.style.overflow = 'hidden'; fit(); addEventListener('resize', fit); fullOff = () => removeEventListener('resize', fit);
  } else {
    root.classList.remove('full'); document.body.style.overflow = ''; root.style.setProperty('--w', root.dataset.ow); root.style.setProperty('--h', root.dataset.oh);
    if (fullOff) fullOff(); fullOff = null;
  }
}

async function startSlideshow(rows) {
  if (!rows.length) return toast('Diaporama', 'Aucune carte à présenter avec ces filtres.', false, 3000);
  const o = document.createElement('div'); o.className = 'show'; document.body.appendChild(o); document.body.style.overflow = 'hidden';
  let i = 0, stop = null, timer = null, paused = false, off = false;
  const close = () => { off = true; clearInterval(timer); if (stop) stop(); o.remove(); document.body.style.overflow = ''; removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); };
  addEventListener('keydown', key);
  async function draw() {
    const c = rows[i]; await resolveUrls([c.front_file, c.back_file]); if (off) return;
    const f = U(c.front_file), b = U(c.back_file), dims = await imgDims(f); if (off) return;
    const land = dims && dims.w > dims.h, ar = land ? 300 / 214 : 210 / 294, H = Math.min(innerHeight - 190, (innerWidth * .86) / ar), W = H * ar;
    if (stop) stop();
    o.innerHTML = `<div class="vitrine full" style="--w:${Math.round(W)}px;--h:${Math.round(H)}px"><div class="pedestal"></div><div class="persp"><div class="floatwrap"><div class="rot" id="rot">
      <div class="face front">${f ? `<img alt="" src="${esc(f)}">` : '<div class="ph">Pas de recto</div>'}<div class="gloss"></div></div>
      <div class="face back">${b ? `<img alt="" src="${esc(b)}">` : '<div class="ph">Pas de verso</div>'}<div class="gloss"></div></div></div></div></div></div>
      <div class="cap">${esc(c.name)}<span class="mono">${i + 1} / ${rows.length}</span></div>
      <div class="ctl"><button class="btn small" id="sp">‹</button><button class="btn small" id="sx">${paused ? '▶' : '❚❚'}</button><button class="btn small" id="sn">›</button><button class="btn small" id="sc">✕ Fermer</button></div>`;
    stop = startVitrine($('.vitrine', o), { auto: true });
    $('#sp', o).onclick = () => step(-1); $('#sn', o).onclick = () => step(1); $('#sc', o).onclick = close;
    $('#sx', o).onclick = () => { paused = !paused; $('#sx', o).textContent = paused ? '▶' : '❚❚'; };
  }
  const step = d => { i = (i + d + rows.length) % rows.length; draw(); };
  timer = setInterval(() => { if (!paused) step(1); }, 8000);
  draw();
}

        else { it.cls = 'ok'; it.status = '✓ ' + doc.name; }
        if (doc.needs_check) { chkN++; it.cls = 'warn'; it.status = '⚠ ' + doc.needs_check; }
      } catch (e) { errN++; it.cls = 'bad'; it.status = '✕ ' + where + ' : ' + ((e && e.message) || 'erreur'); console.error(e); }
      show();
    }
    busy = false;
    $('#done').innerHTML = `<div class="card-sec"><h3>Terminé</h3><p>${okN} carte${okN > 1 ? 's' : ''} ajoutée${okN > 1 ? 's' : ''}${chkN ? ' · ' + chkN + ' à vérifier ⚠' : ''}${errN ? ' · ' + errN + ' en erreur ✕' : ''}.</p>
      <button class="btn block" id="dall">Voir ma collection</button></div>`;
    $('#dall').onclick = () => go('');
  };
}

// ---------- Gérer les listes : renommer, fusionner, supprimer ----------
const LIST_DEFS = [['collections', 'Collections', 'collection_id'], ['brands', 'Marques', 'brand_id'], ['parallels', 'Parallèles', 'parallel_id'], ['players', 'Joueurs', 'player_id'], ['teams', 'Équipes', 'team_id'], ['sports', 'Sports', 'sport_id'], ['binders', 'Classeurs', 'binder_id']];
let listTab = 'collections';
async function viewLists(my) {
  if (my !== routeSeq) return;
  const def = LIST_DEFS.find(d => d[0] === listTab), [t, label, key] = def;
  const nm = x => t === 'collections' ? x.name + (x.year ? ' ' + x.year : '') : x.name;
  const count = id => cards.filter(c => c[key] === id).length;
  app.innerHTML = `<h2 style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px">Mes listes</h2>
    <p class="note" style="margin-top:0">Renomme une entrée pour corriger une faute, ou fusionne deux entrées qui désignent la même chose (par ex. « Ligue 1 » et « Ligue 1 McDonald's ») : toutes les cartes sont alors regroupées sous un seul nom.</p>
    <div class="chips">${LIST_DEFS.map(d => `<button class="chip ${d[0] === t ? 'on' : ''}" data-tab="${d[0]}">${d[1]}</button>`).join('')}</div>
    ${lists[t].length ? lists[t].map(x => `<div class="lrow2" data-id="${esc(x.id)}"><div class="ln"><b>${esc(nm(x))}</b><span class="mono">${count(x.id)} carte${count(x.id) > 1 ? 's' : ''}</span></div><div class="lb"><button class="btn small" data-a="ren">Renommer</button><button class="btn small" data-a="mrg" ${lists[t].length < 2 ? 'disabled' : ''}>Fusionner</button><button class="btn small danger" data-a="del">✕</button></div></div>`).join('') : `<div class="empty">Aucune entrée dans « ${esc(label)} ».</div>`}`;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { listTab = b.dataset.tab; viewLists(routeSeq); });
  document.querySelectorAll('.lrow2').forEach(r => {
    const x = lists[t].find(y => y.id === r.dataset.id);
    r.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      try {
        if (b.dataset.a === 'ren') {
          const v = await askName(label, t === 'collections', x, 'Enregistrer'); if (!v) return;
          const clash = lists[t].find(y => y.id !== x.id && y.name.toLowerCase() === v.name.toLowerCase() && (t !== 'collections' || (y.year || '') === (v.year || '')));
          if (clash) return toast('Erreur — Validation', 'Une entrée « ' + nm(clash) + ' » existe déjà : utilise « Fusionner ».');
          const rec = t === 'collections' ? { name: v.name, year: v.year } : { name: v.name };
          await Store.save(t, x.id, rec); Object.assign(x, rec); lists[t].sort((a, b2) => collator.compare(String(a.name), String(b2.name)));
          cards.forEach(c => { if (c[key] === x.id) c.name = buildName(c); });
          for (const c of cards.filter(c => c[key] === x.id)) { const { id: _i, ...doc } = c; await Store.save('cards', c.id, doc); }
        } else if (b.dataset.a === 'mrg') {
          const to = await askMerge(label, x, lists[t].filter(y => y.id !== x.id), nm); if (!to) return;
          const mv = cards.filter(c => c[key] === x.id);
          if (!(await askConfirm('Fusionner', `« ${nm(x)} » sera fusionnée dans « ${nm(to)} » (${mv.length} carte${mv.length > 1 ? 's' : ''} concernée${mv.length > 1 ? 's' : ''}). Cette action est définitive.`, 'Fusionner'))) return;
          for (const c of mv) { c[key] = to.id; c.name = buildName(c); const { id: _i, ...doc } = c; doc.updated_at = Date.now(); await Store.save('cards', c.id, doc); }
          await Store.remove(t, x.id); lists[t] = lists[t].filter(y => y.id !== x.id);
          toast('Fusion', 'Les cartes sont regroupées sous « ' + nm(to) + ' ».', true, 3000);
        } else {
          const n = count(x.id);
          if (!(await askConfirm('Supprimer « ' + nm(x) + ' »', n ? `${n} carte${n > 1 ? 's' : ''} perdront ce champ (les cartes ne sont pas supprimées).` : 'Cette entrée n\'est utilisée par aucune carte.'))) return;
          for (const c of cards.filter(c => c[key] === x.id)) { c[key] = null; c.name = buildName(c); const { id: _i, ...doc } = c; await Store.save('cards', c.id, doc); }
          await Store.remove(t, x.id); lists[t] = lists[t].filter(y => y.id !== x.id);
        }
        viewLists(routeSeq);
      } catch (e) { fail('Base de données', e); }
    });
  });
}
function askMerge(label, from, others, nm) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="modal"><h3>Fusionner « ${esc(nm(from))} »</h3><div class="field"><label class="l" for="mt">Dans quelle entrée ?</label><select id="mt">${others.map(y => `<option value="${esc(y.id)}">${esc(nm(y))}</option>`).join('')}</select></div>
      <div class="row"><button class="btn block" id="c">Annuler</button><button class="btn primary block" id="o">Continuer</button></div></div>`;
    document.body.appendChild(o);
    const done = v => { o.remove(); res(v); };
    $('#c', o).onclick = () => done(null); $('#o', o).onclick = () => done(others.find(y => y.id === $('#mt', o).value));
  });
}
